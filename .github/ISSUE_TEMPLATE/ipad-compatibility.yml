name: iPad compatibility report
description: Share a stock USB diagnostic report or the results of a charging trial.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Read-only USB reports and charging test results are welcome from Windows and Linux. Remove serial numbers, device instance IDs, and other personal identifiers before posting.
  - type: input
    id: ipad
    attributes:
      label: iPad model and iOS version
      description: Include the A-number on the back. Add the ProductType and USB VID/PID if you know them.
      placeholder: A1396 (iPad2,2), iOS 9.3.5
    validations:
      required: true
  - type: dropdown
    id: ios-setup
    attributes:
      label: iOS setup
      options:
        - Stock iOS (no jailbreak)
        - Jailbreak
        - Unknown
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: Tool version or source commit
      description: Include the release tag, the CLI version, or the commit used for a source build. Say if you checked USB detection using only the operating system.
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: host-os
    attributes:
      label: Host OS version
      description: On Windows, include the build, Apple USB driver version, and Memory Integrity status if known. On Linux, include the distribution, kernel version, and whether it is a native host or WSL.
      placeholder: Windows 11 x64, build 26100, or Debian 13 x64, Linux 6.12
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: USB port, cable, and adapters
      placeholder: Rear USB-A, 30-pin data cable, direct connection
    validations:
      required: true
  - type: textarea
    id: usb-report
    attributes:
      label: USB report
      description: Paste the reviewed usb-report.json from the Windows or Linux guide.
      render: json
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: For a charging test, include the mode, limit, duration, iPad workload, restore result, and whether USB data stayed connected. Add charge icon observations, USB meter readings, or ioreg measurements before, during, and after. On Windows, include the libusb-win32 version if known.
      placeholder: On Debian x64, devices listed 05AC:12A2 and charge check reported PASS.
    validations:
      required: true
