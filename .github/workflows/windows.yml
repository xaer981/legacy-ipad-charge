name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build and test .NET
        shell: pwsh
        run: |
          dotnet build LegacyIpadCharge.slnx '-p:Platform=Any CPU' -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tests/LegacyIpadCharge.Tests -p:Platform=AnyCPU
      - name: Check libusb workflows in Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -File .\tools\Invoke-LibusbChargeTrial.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tests\Test-LibusbWorkflows.ps1
      - name: Check libusb workflows in PowerShell 7
        shell: pwsh
        run: |
          pwsh.exe -NoProfile -File .\tools\Invoke-LibusbChargeTrial.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tests\Test-LibusbWorkflows.ps1
      - name: Build Windows x64 release ZIP
        shell: pwsh
        run: .\tools\Build-Release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-ipad-charge-windows-x64
          path: bin/release/legacy-ipad-charge-windows-x64.zip
          if-no-files-found: error
