name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build and test .NET
        shell: pwsh
        run: |
          dotnet build LegacyIpadCharge.slnx '-p:Platform=Any CPU' -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tests/LegacyIpadCharge.Tests -p:Platform=AnyCPU
      - name: Build Windows x64 release ZIP
        shell: pwsh
        run: .\tools\Build-Release.ps1
      - name: Check the packaged CLI
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'legacy-ipad-charge'
          Expand-Archive -LiteralPath bin/release/legacy-ipad-charge-windows-x64.zip -DestinationPath $output
          if (Get-ChildItem -LiteralPath $output -Recurse -Filter '*.ps1') { throw 'Unexpected PowerShell script in the ZIP.' }
          $cli = Join-Path $output 'legacy-ipad-charge.exe'
          $version = & $cli --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Missing or invalid CLI version.' }
          $help = & $cli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($help -join "`n") -notmatch 'charge restore' -or ($help -join "`n") -notmatch 'filter remove') {
            throw 'Missing charging or filter commands.'
          }
          $trialHelp = & $cli charge trial --help
          if ($LASTEXITCODE -ne 0 -or ($trialHelp -join "`n") -notmatch 'Trial duration \(1-180, default: 30\)') {
            throw 'Missing command-specific help for the timed trial.'
          }
          $help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-ipad-charge-windows-x64
          path: |
            bin/release/legacy-ipad-charge-windows-x64.zip
            bin/release/SHA256SUMS.txt
          if-no-files-found: error
